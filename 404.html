<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" id="theme-color" content="#1a1a1d">
<script>try{var t=localStorage.getItem("theme");if(/^(void|dark|white|blue)$/.test(t))document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="robots" content="noindex">
<title>Page not found — Homepage</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="styles.css">
<style>
  .notfound { position: relative; z-index: 1; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
  .notfound-inner { width: min(520px, 100%); padding: clamp(28px, 7vw, 46px); border: 1px solid var(--line); border-radius: 20px; background: var(--card); box-shadow: 0 24px 80px rgba(0,0,0,.35); }
  .notfound .code { font: 600 clamp(70px, 16vw, 112px)/1 var(--display); letter-spacing: -5px; color: var(--accent); }
  .notfound h1 { margin: 6px 0 10px; font: 600 clamp(26px, 5vw, 34px)/1.1 var(--display); letter-spacing: -1px; }
  .notfound p { margin: 0 auto 24px; max-width: 380px; color: var(--muted); }
  .notfound .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 700 13px var(--font); }
</style>
</head>
<body>
<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
<main class="notfound">
  <div class="notfound-inner">
    <div class="code">404</div>
    <h1>Lost in the void</h1>
    <p>This page does not exist — but there are still good things to find.</p>
    <a class="btn" href="./">Back to Homepage <span aria-hidden="true">↗</span></a>
  </div>
</main>
</body>
</html>
